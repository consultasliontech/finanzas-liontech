<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LionTech Solutions | Quantum Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&family=Cinzel:wght@400;700&display=swap');
        
        :root {
            --gold: #E2B04E;
            --gold-dark: #8A6623;
            --onyx: #050505;
            --glass: rgba(15, 15, 15, 0.7);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--onyx);
            color: #E2E2E2;
            overflow: hidden;
            cursor: crosshair;
        }

        .luxury-font { font-family: 'Cinzel', serif; }

        /* Background Particle Effect */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
            opacity: 0.3;
            pointer-events: none;
        }

        .quantum-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0) 100%);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(226, 176, 78, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .quantum-card:hover {
            border-color: rgba(226, 176, 78, 0.4);
            transform: translateY(-5px) scale(1.01);
            box-shadow: 0 0 40px rgba(226, 176, 78, 0.05);
        }

        .gold-shimmer {
            background: linear-gradient(90deg, #8A6623, #E2B04E, #8A6623);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 4s linear infinite;
        }

        @keyframes shimmer {
            to { background-position: 200% center; }
        }

        .logo-container {
            position: relative;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .logo-container:hover {
            transform: scale(1.1) rotate(-1deg);
        }

        .logo-scan-effect::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(to bottom, transparent, rgba(226, 176, 78, 0.15), transparent);
            transform: rotate(45deg);
            animation: scan 4s infinite linear;
            pointer-events: none;
        }

        @keyframes scan {
            0% { transform: rotate(45deg) translateY(-100%); }
            100% { transform: rotate(45deg) translateY(100%); }
        }

        .glow-btn {
            position: relative;
            overflow: hidden;
            transition: 0.4s;
            border: 1px solid var(--gold-dark);
        }

        .glow-btn:hover {
            box-shadow: 0 0 20px rgba(226, 176, 78, 0.3);
            background: var(--gold);
            color: black !important;
        }

        .sidebar-glow {
            box-shadow: inset -20px 0 50px rgba(0,0,0,0.5);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 10px; }

        .active-tab-indicator {
            filter: drop-shadow(0 0 8px var(--gold));
        }

        .fade-up {
            animation: fadeUp 0.8s ease-out forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const { AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = window.Recharts;

        // Particle background initialization
        const initParticles = () => {
            const canvas = document.getElementById('bg-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            let particles = [];
            
            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 1.2;
                    this.speedX = Math.random() * 0.4 - 0.2;
                    this.speedY = Math.random() * 0.4 - 0.2;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x > canvas.width) this.x = 0;
                    if (this.x < 0) this.x = canvas.width;
                    if (this.y > canvas.height) this.y = 0;
                    if (this.y < 0) this.y = canvas.height;
                }
                draw() {
                    ctx.fillStyle = 'rgba(226, 176, 78, 0.3)';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            for(let i=0; i<80; i++) particles.push(new Particle());

            const animate = () => {
                ctx.clearRect(0,0, canvas.width, canvas.height);
                particles.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animate);
            };
            animate();
        };

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [entries, setEntries] = useState(() => JSON.parse(localStorage.getItem('lt_quantum_entries')) || []);
            const [strategy, setStrategy] = useState(() => JSON.parse(localStorage.getItem('lt_quantum_strat')) || { fixed: 200000, price: 15000, cost: 4500, target: 1000000 });

            // Updated logo URL from direct Supabase storage
            const LOGO_URL = "https://hceckxfxmieqyjafdtqb.supabase.co/storage/v1/object/public/facturas/LionTech_Solutions-removebg-preview.png";

            useEffect(() => {
                localStorage.setItem('lt_quantum_entries', JSON.stringify(entries));
                localStorage.setItem('lt_quantum_strat', JSON.stringify(strategy));
                initParticles();
            }, [entries, strategy]);

            const stats = useMemo(() => {
                const business = entries.filter(e => e.cat === 'biz').reduce((a,c) => a + (c.type === 'in' ? c.amt : -c.amt), 0);
                const personal = entries.filter(e => e.cat === 'pers').reduce((a,c) => a + (c.type === 'in' ? c.amt : -c.amt), 0);
                const margin = strategy.price - strategy.cost;
                return {
                    bizBalance: business,
                    persBalance: personal,
                    total: business + personal,
                    breakEven: Math.ceil(strategy.fixed / (margin || 1)),
                    growth: entries.length > 5 ? 'Optimizado' : 'Fase Inicial'
                };
            }, [entries, strategy]);

            const format = (v) => `₡${Math.abs(v).toLocaleString('es-CR')}`;

            return (
                <div className="relative z-10 flex h-screen w-full select-none">
                    
                    {/* Sidebar: Digital Throne */}
                    <aside className="w-80 bg-[#080808]/95 backdrop-blur-3xl border-r border-white/5 flex flex-col sidebar-glow">
                        <div className="p-10">
                            <div className="flex flex-col items-center text-center mb-16">
                                <div className="logo-container group mb-6">
                                    {/* Ambient Glow */}
                                    <div className="absolute -inset-10 bg-[#E2B04E]/10 blur-3xl rounded-full opacity-40 group-hover:opacity-100 transition duration-1000"></div>
                                    
                                    <div className="relative w-44 h-44 flex items-center justify-center overflow-hidden logo-scan-effect">
                                        <img 
                                            src={LOGO_URL}
                                            alt="LionTech Solutions Logo" 
                                            className="w-full h-full object-contain drop-shadow-[0_0_25px_rgba(226,176,78,0.5)]"
                                            onError={(e) => {
                                                e.target.onerror = null;
                                                e.target.src = 'https://via.placeholder.com/150?text=LionTech';
                                            }}
                                        />
                                    </div>
                                </div>
                                <h1 className="luxury-font text-2xl font-bold tracking-[0.2em] gold-shimmer uppercase">LionTech</h1>
                                <p className="text-[8px] font-black tracking-[0.5em] text-zinc-600 uppercase mt-2">Solutions Group</p>
                            </div>

                            <nav className="space-y-3">
                                {[
                                    { id: 'dashboard', icon: 'shield', label: 'Estrategia Central' },
                                    { id: 'ledger', icon: 'database', label: 'Libro Mayor' },
                                    { id: 'strategy', icon: 'trending-up', label: 'Escalamiento' }
                                ].map(t => (
                                    <button 
                                        key={t.id}
                                        onClick={() => setActiveTab(t.id)}
                                        className={`w-full flex items-center gap-5 px-6 py-5 rounded-2xl transition-all relative group ${activeTab === t.id ? 'bg-white/5 text-white' : 'text-zinc-600 hover:text-zinc-400'}`}
                                    >
                                        {activeTab === t.id && <div className="absolute left-0 w-1 h-6 bg-[#E2B04E] rounded-full active-tab-indicator"></div>}
                                        <Icon name={t.icon} className={activeTab === t.id ? 'text-[#E2B04E]' : 'group-hover:text-zinc-400'} />
                                        <span className="text-[10px] font-bold uppercase tracking-[0.2em]">{t.label}</span>
                                    </button>
                                ))}
                            </nav>
                        </div>

                        <div className="mt-auto p-10">
                            <div className="quantum-card p-6 rounded-3xl bg-black/40 border-l-4 border-l-[#E2B04E]">
                                <span className="text-[8px] font-black text-zinc-600 uppercase tracking-widest block mb-1">Patrimonio Neto</span>
                                <span className="text-xl font-bold luxury-font text-white">{format(stats.total)}</span>
                            </div>
                        </div>
                    </aside>

                    {/* Main Arena */}
                    <main className="flex-1 flex flex-col overflow-hidden">
                        
                        {/* Status Bar */}
                        <header className="h-24 px-12 flex justify-between items-center border-b border-white/5 bg-black/20 backdrop-blur-md">
                            <div className="flex items-center gap-6">
                                <div className="flex items-center gap-3">
                                    <div className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                                    <span className="text-[9px] font-black text-zinc-500 uppercase tracking-widest">Sistemas: Activos</span>
                                </div>
                                <div className="h-4 w-px bg-zinc-800 mx-2"></div>
                                <span className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Nodo: <span className="text-[#E2B04E]">Lion-CR-HQ</span></span>
                            </div>
                            <div className="flex items-center gap-8">
                                <div className="text-right">
                                    <p className="text-[10px] font-black text-zinc-600 uppercase tracking-tighter">Comando Central</p>
                                    <p className="text-[11px] font-bold text-white uppercase tracking-widest">{new Date().toLocaleDateString('es-CR')}</p>
                                </div>
                                <div className="w-12 h-12 rounded-xl border border-white/10 bg-gradient-to-br from-zinc-800 to-black p-0.5 group overflow-hidden">
                                    <img src="image_b1b8e6.png" className="w-full h-full object-cover rounded-lg group-hover:scale-110 transition-transform duration-500" alt="Admin Profile"/>
                                </div>
                            </div>
                        </header>

                        <div className="flex-1 overflow-y-auto p-12 custom-scroll">
                            <div className="max-w-7xl mx-auto space-y-12 fade-up">
                                
                                {activeTab === 'dashboard' && (
                                    <div className="space-y-12">
                                        <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                            {[
                                                { label: 'Efectivo Negocio', val: stats.bizBalance, icon: 'briefcase' },
                                                { label: 'Fondo Personal', val: stats.persBalance, icon: 'user' },
                                                { label: 'Punto de Equilibrio', val: stats.breakEven, icon: 'crosshair', sub: 'Servicios' },
                                                { label: 'Estado Salud', val: stats.growth, icon: 'activity' }
                                            ].map((c, i) => (
                                                <div key={i} className="quantum-card p-8 rounded-[2rem] group relative overflow-hidden">
                                                    <div className="absolute -bottom-4 -right-4 text-white/5 rotate-12 transition-transform group-hover:scale-150">
                                                        <Icon name={c.icon} size={80}/>
                                                    </div>
                                                    <div className="flex justify-between items-start mb-6 relative z-10">
                                                        <div className="p-3 bg-white/5 rounded-xl group-hover:bg-[#E2B04E]/20 transition-colors">
                                                            <Icon name={c.icon} className="text-[#E2B04E]" />
                                                        </div>
                                                        <Icon name="chevron-right" size={14} className="text-zinc-700" />
                                                    </div>
                                                    <h3 className="text-[9px] font-black text-zinc-500 uppercase tracking-[0.3em] mb-2 relative z-10">{c.label}</h3>
                                                    <p className="text-2xl font-bold luxury-font text-white relative z-10">
                                                        {typeof c.val === 'number' && !c.sub ? format(c.val) : `${c.val} ${c.sub || ''}`}
                                                    </p>
                                                </div>
                                            ))}
                                        </div>

                                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                                            <div className="lg:col-span-8 quantum-card p-10 rounded-[2.5rem]">
                                                <div className="flex justify-between items-center mb-10">
                                                    <div>
                                                        <h3 className="luxury-font text-xl font-bold text-white italic">Vector de Capital</h3>
                                                        <p className="text-[10px] text-zinc-600 uppercase font-bold tracking-widest mt-1">Análisis de rendimiento financiero</p>
                                                    </div>
                                                </div>
                                                <div className="h-80 w-full">
                                                    <ResponsiveContainer width="100%" height="100%">
                                                        <AreaChart data={entries.length > 0 ? [...entries].reverse().slice(0,12) : [{date: '', amt: 0}]}>
                                                            <defs>
                                                                <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
                                                                    <stop offset="5%" stopColor="#E2B04E" stopOpacity={0.3}/>
                                                                    <stop offset="95%" stopColor="#E2B04E" stopOpacity={0}/>
                                                                </linearGradient>
                                                            </defs>
                                                            <CartesianGrid strokeDasharray="3 3" stroke="#151515" vertical={false} />
                                                            <XAxis dataKey="date" hide />
                                                            <YAxis hide />
                                                            <Tooltip 
                                                                contentStyle={{ background: '#0a0a0a', border: '1px solid #E2B04E', borderRadius: '12px' }}
                                                                itemStyle={{ color: '#E2B04E', fontSize: '10px' }}
                                                                formatter={(v) => format(v)}
                                                            />
                                                            <Area type="monotone" dataKey="amt" stroke="#E2B04E" strokeWidth={3} fillOpacity={1} fill="url(#goldGrad)" />
                                                        </AreaChart>
                                                    </ResponsiveContainer>
                                                </div>
                                            </div>

                                            <div className="lg:col-span-4 space-y-8">
                                                <div className="quantum-card p-8 rounded-[2rem] bg-gradient-to-br from-[#E2B04E]/5 to-transparent border-t-2 border-t-[#E2B04E]/20">
                                                    <div className="flex items-center gap-3 mb-6">
                                                        <img src={LOGO_URL} className="w-6 h-6 object-contain" alt="Mini Lion Logo"/>
                                                        <h4 className="text-[10px] font-black text-[#E2B04E] uppercase tracking-[0.4em]">Lion Insight</h4>
                                                    </div>
                                                    <div className="p-4 bg-black/50 rounded-2xl border border-white/5">
                                                        <p className="text-[10px] leading-relaxed text-zinc-400 italic">
                                                            "El flujo de caja actual muestra una resiliencia excepcional. Manteniendo este margen, la meta patrimonial se alcanzaría un 15% antes de lo proyectado."
                                                        </p>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'ledger' && (
                                    <div className="space-y-12">
                                        <div className="flex justify-between items-center">
                                            <h2 className="luxury-font text-3xl font-bold text-white tracking-widest italic">Archivo <span className="text-[#E2B04E]">Transaccional</span></h2>
                                        </div>
                                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-10">
                                            <div className="lg:col-span-4">
                                                <div className="quantum-card p-10 rounded-[2.5rem]">
                                                    <form onSubmit={(e) => {
                                                        e.preventDefault();
                                                        const fd = new FormData(e.target);
                                                        const val = parseFloat(fd.get('amt'));
                                                        if(!val) return;
                                                        setEntries([{
                                                            id: Date.now(),
                                                            amt: Math.abs(val),
                                                            type: val >= 0 ? 'in' : 'out',
                                                            desc: fd.get('desc'),
                                                            cat: fd.get('cat'),
                                                            date: new Date().toLocaleDateString('es-CR')
                                                        }, ...entries]);
                                                        e.target.reset();
                                                        confetti({ particleCount: 50, spread: 70, colors: ['#E2B04E', '#ffffff'] });
                                                    }} className="space-y-8">
                                                        <div>
                                                            <label className="text-[9px] font-black text-zinc-500 uppercase tracking-widest mb-2 block">Monto Transaccional (CRC)</label>
                                                            <input name="amt" type="number" step="any" required className="w-full bg-transparent p-4 text-4xl font-bold luxury-font text-white border-b border-white/10 outline-none focus:border-[#E2B04E]" placeholder="0.00"/>
                                                        </div>
                                                        <div className="space-y-4">
                                                            <select name="cat" className="w-full p-4 rounded-xl bg-white/5 border border-white/5 text-[10px] font-black text-white outline-none">
                                                                <option value="biz">LionTech Solutions</option>
                                                                <option value="pers">Patrimonio Personal</option>
                                                            </select>
                                                            <input name="desc" required placeholder="Concepto de la operación..." className="w-full p-4 rounded-xl bg-white/5 border border-white/5 text-[10px] font-bold text-white outline-none"/>
                                                        </div>
                                                        <button type="submit" className="w-full py-5 rounded-xl glow-btn luxury-font font-bold uppercase text-[10px] tracking-widest">Registrar Operación</button>
                                                    </form>
                                                </div>
                                            </div>
                                            <div className="lg:col-span-8 quantum-card rounded-[2.5rem] overflow-hidden">
                                                <div className="max-h-[500px] overflow-y-auto custom-scroll">
                                                    <table className="w-full text-left">
                                                        <thead>
                                                            <tr className="border-b border-white/5 bg-black/40">
                                                                <th className="p-6 text-[8px] font-black text-zinc-600 uppercase">Descripción</th>
                                                                <th className="p-6 text-[8px] font-black text-zinc-600 uppercase">Estado</th>
                                                                <th className="p-6 text-right text-[8px] font-black text-zinc-600 uppercase">Monto</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody className="divide-y divide-white/5">
                                                            {entries.length === 0 ? (
                                                                <tr>
                                                                    <td colSpan="3" className="p-20 text-center text-zinc-600 italic text-[10px] uppercase tracking-widest">Esperando datos transaccionales...</td>
                                                                </tr>
                                                            ) : (
                                                                entries.map(e => (
                                                                    <tr key={e.id} className="hover:bg-white/5 transition-all group">
                                                                        <td className="p-6">
                                                                            <p className="text-[11px] font-bold text-white group-hover:text-[#E2B04E]">{e.desc}</p>
                                                                            <p className="text-[9px] font-black text-zinc-600 mt-1 uppercase tracking-widest">{e.date}</p>
                                                                        </td>
                                                                        <td className="p-6">
                                                                            <span className={`text-[8px] px-3 py-1 rounded-full border ${e.type === 'in' ? 'border-emerald-500/30 text-emerald-500' : 'border-zinc-700 text-zinc-500'} font-black uppercase`}>
                                                                                {e.type === 'in' ? 'Activo' : 'Gasto'}
                                                                            </span>
                                                                        </td>
                                                                        <td className={`p-6 text-right luxury-font font-bold ${e.type === 'in' ? 'text-white' : 'text-zinc-500 opacity-60'}`}>
                                                                            {format(e.amt)}
                                                                        </td>
                                                                    </tr>
                                                                ))
                                                            )}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'strategy' && (
                                    <div className="space-y-12">
                                        <div className="text-center">
                                            <h2 className="luxury-font text-4xl font-bold text-white italic tracking-widest">Quantum <span className="text-[#E2B04E]">Scaling</span></h2>
                                            <p className="text-[10px] text-zinc-500 font-bold uppercase tracking-[0.4em] mt-4">Simulador de Expansión Corporativa</p>
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                                            {[
                                                { label: 'Gastos Fijos', key: 'fixed' },
                                                { label: 'Precio Servicio', key: 'price' },
                                                { label: 'Costo Operativo', key: 'cost' },
                                                { label: 'Meta Patrimonio', key: 'target' }
                                            ].map(f => (
                                                <div key={f.key} className="quantum-card p-10 rounded-[2rem]">
                                                    <p className="text-[10px] font-black text-zinc-600 uppercase tracking-widest mb-4">{f.label}</p>
                                                    <div className="flex items-center gap-2 border-b border-white/5 pb-2">
                                                        <span className="text-[#E2B04E] font-bold">₡</span>
                                                        <input 
                                                            type="number" 
                                                            value={strategy[f.key]} 
                                                            onChange={e => setStrategy({...strategy, [f.key]: parseFloat(e.target.value) || 0})}
                                                            className="w-full bg-transparent text-xl font-bold text-white outline-none luxury-font"
                                                        />
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        
                                        <div className="quantum-card p-12 rounded-[3rem] bg-gradient-to-r from-black via-zinc-900 to-black text-center border-l-2 border-l-[#E2B04E]">
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-12">
                                                <div>
                                                    <p className="text-[10px] font-black text-zinc-600 uppercase tracking-[0.4em] mb-4">Margen Neto Unitario</p>
                                                    <p className="text-5xl font-bold text-white luxury-font italic tracking-tighter">{format(strategy.price - strategy.cost)}</p>
                                                </div>
                                                <div>
                                                    <p className="text-[10px] font-black text-zinc-600 uppercase tracking-[0.4em] mb-4">Eficiencia Operativa</p>
                                                    <p className="text-5xl font-bold text-[#E2B04E] luxury-font italic tracking-tighter">
                                                        {strategy.price > 0 ? (((strategy.price - strategy.cost) / strategy.price) * 100).toFixed(1) : 0}%
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
